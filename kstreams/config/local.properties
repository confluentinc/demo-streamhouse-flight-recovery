# Kafka Streams app against the local broker from kstreams/local/docker-compose.yml.
application.id=river-air-ops
bootstrap.servers=localhost:9092
schema.registry.url=http://localhost:8081
group.protocol=streams
processing.guarantee=exactly_once_v2
state.dir=build/state
http.base.port=7070
# v1 = KafkaStreams#store, v2 = KafkaStreams#query. v2 can deadlock under concurrent writes through 4.4.0 (KAFKA-19629, fixed for 4.5).
query.api=v1
